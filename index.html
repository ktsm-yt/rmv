<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<!-- viewport-fit=cover と body 下端の safe-area の余白は外した: Soul (Android WebView) は下に自分のツールバーがあるのに 39px を返し、帯の下が空いていた (2026-11-13 user)。cover を付けなければ普通のブラウザも 0 を返す -->
<link rel="icon" type="image/png" href="/favicon.png">
<title>rmv (Red Marker Viewer): 返事を見て赤ペンで返す</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5; --panel: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --line: #e3e3e0;
    --red: #dc2626; --yellow: #d97706; --green: #16a34a;
    --card: #ffffff; --code-fg: #8a5a00; --link: #1a56db;
    --measure: 760px; /* 返事の列幅: 番号列 (約 72px) + 本文 約 74ch (16px)。#bar #chips #reply #tray で揃える */
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16171a; --panel: #1f2126; --fg: #e8e8ea; --muted: #9a9aa2; --line: #2e3037; --card: #2a2d33; --code-fg: #f3d9a0; --link: #8ab4f8; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; height: 100dvh; height: calc(var(--vvh, 100dvh) / var(--z, 1)); display: grid; grid-template-columns: minmax(0, 1fr) 200px;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.8; background: var(--bg); color: var(--fg);
  }
  /* 右端のプロジェクト列: 既定は畳んだ ☰ だけの細帯で、ホバーで画面の上に重ねて開く (2026-11-10 user: 左 → 右、重ねて開く)。☰ で列として開いた選択は広い幅でだけ localStorage "rmx.projR" に覚える */
  #proj { grid-column: -2; overflow-y: auto; padding: 8px 4px; border-left: 1px solid var(--line); background: var(--bg); font-size: 13px; line-height: 1.5; }
  /* ☰ / ＋ の位置は畳んだ細帯 (32px = 4 + 24 + 4) に合わせて全状態で同じ。開いた時に動かさない。一覧だけ左右に余白を足す */
  #plist { padding: 4px 4px 0; }
  #phead { display: flex; flex-direction: column; align-items: var(--pha, flex-end); } /* ☰ の真下に ＋ (開閉どちらでも縦) */
  #phead #ptoggle { margin-bottom: 4px; }
  #phead #newbtn { display: flex; flex-direction: var(--nbd, row-reverse); align-items: center; gap: 8px; white-space: nowrap; } /* #phead 付き: 下の共通ボタン指定 (display: block) に負けないように */
  #newbtn > span:first-child { flex: none; width: 22px; text-align: center; } /* ＋ は畳み (幅 24 = 枠 22 + 線) と同じ位置に固定。広がってもずらさない */
  #newbtn .nl { display: none; font-size: 12px; }
  /* 列が広がっている時 (開いた状態 / 畳んだ列のホバー展開 / 一覧を開いて固定中) だけ ＋ の左にラベルを出す。細帯では隠す */
  body:not(.proj-closed) #newbtn, body.proj-closed.proj-peek #newbtn, body.proj-closed.new-open #newbtn { width: auto; padding: var(--nbp, 0 0 0 10px); }
  body:not(.proj-closed) #newbtn .nl, body.proj-closed.proj-peek #newbtn .nl, body.proj-closed.new-open #newbtn .nl { display: inline; }
  #ptoggle, #newbtn, #pside, #ctoggle { display: block; font: inherit; font-size: 14px; line-height: 1; width: 24px; height: 24px; padding: 0; margin-bottom: 8px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  /* ＋ 新規の一覧 (fixed): 開いている間は畳んだ列を広げたまま固定する (body.new-open)。行を押すと即 POST /new */
  body.proj-closed.new-open #proj { position: fixed; right: var(--pr, 0); left: var(--pl, auto); top: 0; bottom: 0; width: 240px; padding: 8px 4px; overflow-y: auto; z-index: 20; box-shadow: var(--psh, -6px) 0 18px rgb(0 0 0 / .18); }
  body.proj-closed.new-open #plist { display: block; }
  #newpop { position: fixed; right: var(--pr4, 4px); left: var(--pl4, auto); top: 72px; width: min(300px, 92vw); max-height: 70vh; overflow-y: auto; z-index: 30; padding: 6px; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 18px rgb(0 0 0 / .4); font-size: 13px; line-height: 1.5; }
  #newpop[hidden] { display: none; }
  #newpop .hd { font-size: 11px; color: var(--muted); padding: 2px 8px 4px; }
  #newpop .it { display: flex; justify-content: space-between; gap: 8px; align-items: center; width: 100%; min-height: 40px; box-sizing: border-box; padding: 5px 8px; font: inherit; text-align: left; color: var(--fg); background: none; border: 0; border-radius: 6px; cursor: pointer; }
  #newpop .it:hover { background: color-mix(in srgb, var(--fg) 8%, transparent); }
  #newpop .it.sub { padding-left: 22px; color: var(--muted); font-size: 12px; }
  #newpop .it.cur { background: color-mix(in srgb, var(--red) 22%, transparent); font-weight: 600; }
  #newpop .it .k { font-size: 11px; color: var(--red); white-space: nowrap; }
  #newpop .it:disabled { opacity: .5; cursor: default; }
  #ptoggle.unread { border-color: var(--red); color: var(--red); }
  body.proj-closed { grid-template-columns: minmax(0, 1fr) 32px; }
  body.proj-closed #proj { overflow: hidden; }
  body.proj-closed #plist { display: none; }
  /* 畳んでいてもホバーで重ねて開く (離すと閉じる)。☰ で開きっぱなしにもできる (2026-09-29 user) */
  /* 帯を横切るだけで開いてしまうので、どの幅でも上の ☰ ＋ ⇆ に乗った時だけ開く (proj-peek。2026-10-25 狭い幅 / 10-30 サイドパネル / 11-10 右端に移して広い幅も、user) */
  body.proj-closed.proj-peek #proj { position: fixed; right: var(--pr, 0); left: var(--pl, auto); top: 0; bottom: 0; width: 240px; padding: 8px 4px; overflow-y: auto; z-index: 20; box-shadow: var(--psh, -6px) 0 18px rgb(0 0 0 / .18); }
  body.proj-closed.proj-peek #plist { display: block; }
  /* 狭い幅 (< 700px) とスマホ (mobile UA、幅は問わない) は html.narrow (head の script が付ける)。:where で詳細度を @media 版と同じに保つ */
  /* 狭い幅では開いても返事を押し潰さず、上に重ねる */
  :where(html.narrow) body { grid-template-columns: minmax(0, 1fr) 32px; }
  :where(html.narrow) body:not(.proj-closed) #proj { position: fixed; right: var(--pr, 0); left: var(--pl, auto); top: 0; bottom: 0; width: min(280px, 88vw); z-index: 20; box-shadow: var(--psh, -6px) 0 18px rgb(0 0 0 / .18); }
  .prow { display: block; width: 100%; text-align: left; font: inherit; color: var(--fg); background: none; border: 0; border-radius: 6px; padding: 6px 8px; margin-bottom: 2px; cursor: pointer; }
  .prow:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); }
  .prow.on { background: var(--fg); color: var(--bg); }
  .prow .pn { display: flex; gap: 6px; align-items: center; font-weight: 600; }
  .prow .pn b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: inherit; }
  .prow time { font-size: 11px; font-weight: 400; color: var(--muted); }
  .prow .ph { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow.on time, .prow.on .ph { color: inherit; opacity: .7; }
  .prow.dead:not(.on) { opacity: .55; }
  .ptabs { display: flex; gap: 2px; } /* 「メイン」 / 「🤖 ワーカー」(subagent) の 2 択 */
  .ptabs .prow { width: auto; }
  .ptabs .prow + .prow { font-size: 12px; }
  #pdead { font: inherit; font-size: 11px; color: var(--muted); background: none; border: 0; padding: 6px 8px; cursor: pointer; text-decoration: underline; }
  .rc { flex: none; font-style: normal; font-size: 10px; margin-right: 4px; color: var(--rc); } /* repo 色の丸: プロジェクト列・上の chip で同じ色 = 同じ repo */
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  main { grid-column: 1; overflow-y: auto; padding: 32px 56px; }
  /* チャット欄: ピン無しで自由文を元の端末へ。幅 900px 以上は右の列、未満は返事の上の帯 (grid の 1 行目なので返事をスクロールしても隠れない) */
  #chat { display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow: hidden; padding: 12px; border-left: 1px solid var(--line); background: var(--bg); font-size: 13px; line-height: 1.5; }
  #chead { display: flex; gap: 6px; align-items: center; }
  #ctoggle { flex: none; margin: 0; font-size: 10px; color: var(--muted); }
  /* 開閉の印は三角で状態を見せる (鉛筆では畳めると分からなかった、2026-10-25 user)。広い幅は右の列なので ▶ で右へ畳む / ◀ で戻す */
  #ctoggle::before { content: "▶"; }
  body.chat-closed #ctoggle::before { content: "◀"; }
  #cto { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  #cchips { flex: none; display: grid; gap: 4px; padding-bottom: 2px; } /* 送り先: 直近 5 セッションを縦に積む (横並びだとどれがどれか分からない) */
  #cchips .chip { display: flex; gap: 8px; text-align: left; overflow: hidden; white-space: nowrap; border-radius: 6px; border-left: 3px solid var(--rc, var(--line)); }
  #cchips .chip time { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; }
  #cchips .chip time.busy, #cchips .chip time.perm { color: var(--fg); font-weight: 700; }
  #cchips .chip time.wait, #cchips .chip time.ng, #cchips .chip time.bg { color: #e5a50a; font-weight: 700; }
  #cchips .chip time.ok { color: #2ec27e; }
  #cchips .chip.on time { color: inherit; }
  #cchips .chip i { margin-top: 5px; }
  #cchips .chip span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #cchips:has(.live-codex-label) { max-height: 38vh; overflow-y: auto; }
  #cform { display: flex; flex-direction: column; gap: 6px; }
  #tstat { flex: none; display: grid; gap: 2px; font-size: 12px; color: var(--muted); } /* 端末ごとの待ち状態 (chip と同じ集合) */
  #tstat .trow { display: flex; gap: 8px; overflow: hidden; white-space: nowrap; cursor: pointer; border-left: 3px solid var(--rc, var(--line)); padding-left: 6px; }
  #tstat .trow span { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; }
  #tstat .trow.wait { color: inherit; font-weight: 700; }
  /* 状態アイコン (文字でなく絵で。2026-09-29 user): 作業中 = 1 秒で 12 コマ回るリング / 待ち = 目立つ点 / 静か = 薄い丸。なめらかな回転・明滅は止まっていても毎秒 60 回の描き直しになり、サイドバーに常駐させると Mac 全体の描画 (WindowServer) を詰まらせた (2026-11-13 実測 10 秒で 600 回)。止めると動いているか不安になる (同日 user) ので、コマ送りで回す。4 コマでは遅く見えて不安 (2026-11-14 user) なので 12 コマ (10 秒 約 130 回、headless 実測)。印が何個あっても同じ瞬間に描き直すよう syncSpin で回転をそろえる */
  #cchips .chip i, #tstat i { flex: none; width: 10px; height: 10px; margin-top: 4px; border-radius: 50%; box-sizing: border-box; }
  #cchips .chip i.busy, #tstat i.busy { border: 2px solid var(--line); border-top-color: var(--fg); animation: tspin 1s steps(12) infinite; }
  @keyframes tspin { to { transform: rotate(360deg); } }
  #cchips .chip i.wait, #tstat i.wait { background: #e5a50a; box-shadow: 0 0 0 3px rgb(229 165 10 / .25); }
  #cchips .chip i.perm, #tstat i.perm { background: #e01b24; box-shadow: 0 0 0 3px rgb(224 27 36 / .25); }
  #tstat .trow.perm { color: inherit; font-weight: 700; }
  #tstat .trow.bot-perm { cursor: default; }
  #tstat .trow.bot-perm span { white-space: normal; overflow-wrap: anywhere; }
  /* Bot の完了・判断待ちの知らせ (未読 = 太字)。同じ文の見えない太字を重ねて場所を取っておき、開いて太字が外れても折り返しと行の高さを変えない */
  #tstat .note { --rc: #e5a50a; } #tstat .note:has(i.ok) { --rc: #2ec27e; } #tstat .note:is(:has(i.idle), .more) { --rc: var(--line); }
  #tstat .note.new { color: var(--fg); font-weight: 700; } #tstat .note.on { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
  #tstat .note :is(span, time) { display: grid; } #tstat .note :is(span, time)::after { content: attr(data-t); visibility: hidden; font-weight: 700; }
  #tstat .note b, #tstat .note :is(span, time)::after { grid-area: 1 / 1; min-width: 0; } #tstat .note b { font-weight: inherit; }
  #tstat .note span > b, #tstat .note span::after { white-space: normal; overflow: hidden; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
  html:not(.mob) body.chat-closed #ctoggle.unread { box-shadow: 0 0 0 2px #e5a50a; }
  #tstat button { flex: none; font-size: 11px; padding: 0 8px; line-height: 18px; }
  #cchips .chip i.idle, #tstat i.idle { border: 2px solid var(--line); }
  #cchips .chip i.ng, #tstat i.ng { background: #e5a50a; box-shadow: 0 0 0 3px rgb(229 165 10 / .25); } /* 返事が要る (終了: NG) = 入力待ちと同じ黄の点 */
  #cchips .chip i.ok, #tstat i.ok { background: #2ec27e; } /* 閉じてよい (終了: OK) = 緑の点、光らせない */
  #cchips .chip i.bg, #tstat i.bg { border: 2px solid #e5a50a; animation: tblink 2s step-end infinite; } /* 裏で待ち (shell / monitor / subagent が走っていて、終わると起きる) = 黄のリング (中を塗らないので入力待ちの黄の点と見分けられる) がゆっくり明滅する。なめらかな明滅 (1.6s ease-in-out) は 10 秒で 600 回描き直した。0.5 秒ごとの 4 コマ (v0.21.16、25 回) は粗いと言われた (2026-11-16 user) ので、作業中の回転と同じ 1 秒 12 コマで刻み、同じ瞬間に描き直す。10 秒 125 回で、作業中の印と一緒に出ても 125 回のまま (headless 実測、test/bg-blink.test.sh) */
  @keyframes tblink { 4.167%, 95.833% { opacity: .987; } 8.333%, 91.667% { opacity: .950; } 12.5%, 87.5% { opacity: .890; } 16.667%, 83.333% { opacity: .812; } 20.833%, 79.167% { opacity: .722; } 25%, 75% { opacity: .625; } 29.167%, 70.833% { opacity: .528; } 33.333%, 66.667% { opacity: .438; } 37.5%, 62.5% { opacity: .360; } 41.667%, 58.333% { opacity: .300; } 45.833%, 54.167% { opacity: .263; } 50% { opacity: .250; } } /* 明るさを余弦の曲線で 24 コマに刻む (1 → .25 → 1)。コマの境目は 1/12 秒ごとで、作業中の回転 (1 秒 12 コマ) と同じ瞬間 */
  .hid #cchips .chip i.bg, .hid #tstat i.bg { animation: none; } /* タブが隠れている間は止める (visibilitychange) */
  @media (prefers-reduced-motion: reduce) { #cchips .chip i.busy, #tstat i.busy, #cchips .chip i.bg, #tstat i.bg { animation: none; } } /* 明滅の行より後ろに置く (同じ強さの指定は後ろが勝つ) */
  #tstat .task { white-space: pre-wrap; color: var(--fg); padding: 2px 6px 6px 15px; max-height: 40vh; overflow: auto; } /* 行を押すと開く依頼文の全文 */
  #sug { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); overflow: hidden; margin-bottom: 6px; }
  #sug div { padding: 3px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  #sug div.on { background: var(--bg); box-shadow: inset 2px 0 var(--red); }
  #sug b { color: var(--fg); } #sug span { color: var(--muted); margin-left: 8px; }
  #ctext { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; resize: none; field-sizing: content; overflow-x: hidden; min-height: 10em; max-height: 60vh; } /* 文字量で上へ伸びる (欄は列の下に貼り付き)。掴んで伸ばす角は無し (2026-09-29 user: 右下からの操作が効かない) */
  #cact { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; justify-content: flex-end; }
  #cact .q { font: inherit; font-size: 12px; line-height: 1.6; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
  #cact .q sup { color: var(--muted); font-size: 9px; margin-left: 2px; }
  #cact .q:disabled { opacity: .35; cursor: default; }
  #copt { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
  #copt:empty { display: none; }
  #cact .cpick { font: inherit; font-size: 12px; line-height: 1.6; padding: 1px 2px; max-width: 100%; min-width: 0; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
  #cact .cpick:disabled { opacity: .35; cursor: default; }
  #cbar { flex-basis: 100%; display: flex; gap: 4px; justify-content: flex-end; align-items: center; min-width: 0; } /* 最下段 = [モデル▾][エフォート▾][送信] */
  #cctx { flex: none; font-size: 11px; color: var(--muted); white-space: nowrap; }
  #cctx.warn { color: var(--yellow); } #cctx.crit { color: var(--red); }
  #cctx:empty { display: none; }
  #cattach { display: none; flex: none; order: -1; margin-right: auto; font: inherit; line-height: 1.6; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
  #cattach:disabled { opacity: .35; cursor: default; }
  html.narrow #cattach { display: block; } /* 左端 (送信と反対側) に固定。スマホは貼り付けが無いので写真から選ぶ */
  #csend { flex: none; font: inherit; color: #fff; background: var(--red); border: 1px solid var(--red); border-radius: 6px; padding: 2px 12px; cursor: pointer; }
  #ctext:disabled, #csend:disabled { opacity: .35; cursor: default; }
  #cmedia { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; align-content: start; } /* 右下: 使った画像・PDF。欄の幅で 2〜3 列 */
  #cmedia:empty { display: none; }
  #cmedia .mt { display: flex; flex-direction: column; justify-content: center; aspect-ratio: 1; padding: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); font: inherit; font-size: 11px; text-decoration: none; cursor: zoom-in; }
  #cmedia .mt img { width: 100%; height: 100%; object-fit: cover; }
  #cmedia .mm { background: var(--bg); padding: 4px; }
  #cmedia .mm svg { width: 100%; height: 100%; max-width: none !important; pointer-events: none; }
  #cmedia .pdf { cursor: pointer; align-items: center; gap: 4px; padding: 6px; }
  #cmedia .pdf b { color: var(--red); font-size: 14px; }
  #cmedia .pdf span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  #cimgs:not([hidden]), #fimgs:not([hidden]) { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 6px; }
  .cimg { position: relative; }
  .cpdf { display: block; height: 56px; max-width: 120px; padding: 0 8px; line-height: 56px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; border-radius: 6px; border: 1px solid var(--line); }
  .cimg img, .cimg video { display: block; height: 56px; max-width: 120px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
  .cimg button { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font-size: 11px; line-height: 1; cursor: pointer; }
  #tstat .note.clear { --rc: var(--line); cursor: default; } html.mob #tstat .note.clear { border: 0; } html.mob #tstat .note.clear button { min-height: 44px; }
  #askbox { max-width: var(--measure); margin: 14px 0; padding: 10px 14px; border: 1px solid var(--line); border-left: 4px solid #e5a50a; border-radius: 10px; background: var(--panel); font-size: 14px; }
  #asktext { display: block; box-sizing: border-box; width: 100%; margin: 0 0 8px; padding: 8px 10px; font: inherit; font-size: 16px; line-height: 1.5; resize: vertical; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
  #askbox #asksend { background: var(--red); border-color: var(--red); color: #fff; padding: 4px 22px; } #askbox > .rs { align-items: center; margin: 0; }
  #askbox p { margin: 6px 0; font-weight: 700; } #askbox .rs { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }

  :where(html.wide) {

  /* ⇆ で左に置く (localStorage "rmx.side" = left、2026-11-10 user: 左右は好みなので設定で分ける)。並びを反転し、重ねて開く向き・寄せる向きを変数で左右入れ替える */

  };

// 返事中の絶対パス: GET /file でその場に出す型 (server.ts の FILE_EXT と揃える。json は除く) 以外は全部 POST /open。
// 開けるかの最終判定は server だけ (拡張子一覧は持たない。403 は title に出る)
const FILE_EXT = "png|jpe?g|gif|webp|svg|mp4|mov|webm|m4a|mp3|wav|html?|pdf|txt";
const FILE_RE = new RegExp(`\\.(?:${FILE_EXT})$`, "i");
const IS_ROOT = /^\/(Users|private|tmp|var)\//;
const MEDIA = [["img", /\.(png|jpe?g|gif|webp|svg)$/i], ["video", /\.(mp4|mov|webm)$/i], ["audio", /\.(m4a|mp3|wav)$/i]];
// 生の絶対パス: 直前が語・"/"・`](`・< " ' = (markdown リンク/画像や HTML 属性の中) なら置換しない。末尾の "." は句点として外す
const RAWPATH = new RegExp(`(?<![\\w/<"'=]|\\]\\()/(?:Users|private|tmp|var)/[^\\s)\\]"'<>]*\\.[A-Za-z0-9]{1,12}(?![\\w/-]|\\.\\w)`, "gi");
const WHOLE_PATH = /^\/(?:Users|private|tmp|var)\/[^)\]"'<>`]*\.[A-Za-z0-9]{1,12}$/i;
const fileURL = (p) => `/file?p=${encodeURIComponent(p)}`;
// open 型 (/file 型以外) は navigable な URL にしない (renderer が <a href="#" data-open> にする)
const pathHref = (p) => !FILE_RE.test(p) ? `#open:${encodeURIComponent(p)}` : fileURL(p);
const mdText = (s) => s.replace(/[[\]\\*_]/g, "\\$&");
// 1 行の生パスを [basename](/file?p=…) に置き換え、画像・動画・音声のパスを media に集める。code span の中は触らない
function linkPaths(t, wholeLine = false) {
  const media = [];
  const link = (p) => {
    if (MEDIA.some(([, re]) => re.test(p))) media.push(p);
    return `[${mdText(p.split("/").pop())}](${pathHref(p)})`;
  };
  const md = t.split(/(`[^`]*`)/).map((s, i) => i % 2 ? s : s.replace(RAWPATH, link)).join("");
  // 既存のリンクを優先し、相対ファイル名で終わる地の文を巻き込まない
  if (wholeLine && md === t && WHOLE_PATH.test(t)) return { md: link(t), media };
  return { md, media };
}
let mediaV = 0;
// 同じ行のメディアは 1 つの .media に入れる (2 つ以上なら CSS で横並び)
function mediaHTML(paths) {
  const one = (p) => {
    const kind = MEDIA.find(([, re]) => re.test(p))?.[0];
    const u = esc(fileURL(p) + "&v=" + mediaV); // 返事ごとに変える: 同じ URL だとブラウザがページ内の古い画像を使い回す (上書きした png が替わらない)
    if (kind === "img") return `<img src="${u}" loading="lazy" title="クリックで拡大">`; // 拡大は zoomImage (mermaid と同じ全画面)
    if (kind === "video") return `<video controls preload="metadata" src="${u}"></video>`;
    return `<audio controls src="${u}"></audio>`;
  };
  return `<div class="media">${paths.map(one).join("")}</div>`;
}

// ```html は sandbox iframe、```mermaid は図、他は通常のコード
// markdown 内の生 HTML は DOMPurify を通す (<img> は残し、onerror / script / iframe は落とす)。
// 返事が web ページ等の外部文を引いた時に、その HTML が viewer と同じ origin で /send (端末へのキー入力) を叩けないように
marked.use({
  // markdown リンク・画像の href が絶対パスなら /file 経由にする (renderer より前に token を書き換える)
  walkTokens(t) { if ((t.type === "link" || t.type === "image") && IS_ROOT.test(t.href)) t.href = t.type === "link" ? pathHref(t.href) : fileURL(t.href); },
  renderer: {
    html({ text }) { return DOMPurify.sanitize(text); },
    // http(s) と /file は新タブ: Orca のフローティングブラウザの viewer から離れないように。他は既定の描画
    // それ以外のスキーム (javascript: 等) は文字だけにする: 返事に混ざった外部文のリンクから /send を叩かせない。href は esc して文字参照でのすり抜けも止める
    link({ href, title, tokens }) {
      const text = this.parser.parseInline(tokens);
      if (href.startsWith("#open:")) return `<a href="#" data-open="${esc(decodeURIComponent(href.slice(6)))}"${title ? ` title="${esc(title)}"` : ""}>${text}</a>`;
      if (/^[a-z][\w+.-]*:/i.test(href) && !/^(https?|mailto):/i.test(href)) return text;
      const tab = /^(https?:\/\/|\/file\?)/i.test(href) ? ` target="_blank" rel="noopener"` : "";
      return `<a href="${esc(href)}"${title ? ` title="${esc(title)}"` : ""}${tab}>${text}</a>`;
    },
    code({ text, lang }) {
      if (lang === "mermaid") return `<pre class="mermaid">${esc(text)}</pre>`;
      if (lang === "html") return `<iframe sandbox="allow-scripts" srcdoc="${esc(text)}"></iframe>`;
      return `<div class="cp"><pre><code${lang ? ` class="language-${esc(lang)}"` : ""}>${esc(text)}</code></pre><button class="mmzoom cpbtn" title="コピー">⧉</button></div>`;
    },
  },
});

// Low-Load の型を固定の置き場所へ写す。行単位で読み、フェンスと表だけ marked に丸ごと渡す。
// ponytail: 認識するのは 行頭 "N. " の段 / ⅰ〜・英字の項目 / 🔴🟡🟢 / 表 / ``` / 見出し / 検証: DECIDE: だけ。上限 = Low-Load 型の返事。
// それ以外の markdown (- 箇条書き・引用・4 スペース code) は 1 行ずつ inline で描き、字下げは幅で表す。
const ROMAN = /^[ⅰ-ⅿ]/;
const LETTER_ITEM = /^(?:[-+*]\s+)?(?:\*\*)?(?:\(([A-Za-z])\)|([A-Za-z])(?:\\?\.|[)）:：．、]))(?:\*\*)?(?=\s|$|[^\x00-\x7F])/;
const PRI = [["🔴", "red"], ["🟡", "yellow"], ["🟢", "green"]];
function renderLowLoad(md) {
  const lines = md.replace(/\r\n?/g, "\n").split("\n");
  const blocks = [];
  const foot = [];
  let cur = null;
  const open = (num, label = null) => { cur = { num, label, html: [], pri: new Set() }; blocks.push(cur); };
  const push = (h) => { if (!cur) open(null); cur.html.push(h); };
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    const t = raw.trim();
    const ind = raw.length - raw.trimStart().length;
    if (/^(```|~~~)/.test(t)) {
      const fence = t.slice(0, 3);
      const chunk = [t];
      while (++i < lines.length && !lines[i].trim().startsWith(fence)) chunk.push(lines[i].slice(Math.min(ind, lines[i].length - lines[i].trimStart().length)));
      chunk.push(fence);
      push(marked.parse(chunk.join("\n")));
      continue;
    }
    if (t.startsWith("|")) {
      const chunk = [t];
      while (i + 1 < lines.length && lines[i + 1].trim().startsWith("|")) chunk.push(lines[++i].trim());
      push(`<div class="tbl">${marked.parse(chunk.join("\n")).replace(/[■□]{2,}/g, (b) => `<span class="bar5">${b}</span>`)}</div>`);
      continue;
    }
    const { md: lt, media } = linkPaths(t, true);
    if (/^(検証|DECIDE)\s*[:：]/.test(t)) { foot.push(`<div>${marked.parseInline(lt)}</div>`); continue; }
    if (!t) { if (cur && cur.html.length) cur.html.push('<div class="gap"></div>'); continue; }
    // 行頭 "A:" / "A：" (英大文字 1 字 + コロン) の段も番号段落と同じく独立したピン対象にする (表の下の 案 A〜D の理由段が直前の "3." に吸収されていた)
    const m = ind === 0 && (raw.match(/^(\d+)\\?\.\s+(.*)$/) ?? raw.match(/^([A-Z])[:：]\s*(.*)$/));
    // 太字だけの行・# 見出しも段の区切りにする (番号段落を使わない返事でも段ごとにピンが付く)
    const h = !m && ind === 0 && (t.match(/^\*\*(.+)\*\*$/) ?? t.match(/^#{1,6}\s+(.+)$/));
    // パスだけの行 (「ⅱ /b.png」等) が画像の直後に続いたら、行を出さずに前の格子へ足す (画像 1・2・3 を 1 つの格子に)
    const pathOnly = media.length && !t.replace(RAWPATH, "").replace(ROMAN, "").trim();
    const last = cur?.html.at(-1) ?? "";
    if (!m && !h && pathOnly && last.startsWith('<div class="media">')) { cur.html[cur.html.length - 1] = last.replace(/<\/div>$/, mediaHTML(media).slice('<div class="media">'.length)); continue; }
    if (m) { open(m[1]); if (m[2].trim()) push(`<div class="ln head">${marked.parseInline(linkPaths(m[2]).md)}</div>`); }
    else if (h) {
      const s = h[1].replace(/\*\*/g, "").trim();
      open(null, s.match(/^\d+(?:-[ⅰ-ⅿ]+)*(?=\s|$)/)?.[0] ?? cut(s, 12)); // "3-ⅴ 🟢 ui-design" → 3-ⅴ
      push(`<div class="ln head">${marked.parseInline(linkPaths(h[1]).md)}</div>`);
    }
    else {
      const letter = t.match(LETTER_ITEM);
      const item = t.match(ROMAN)?.[0] ?? letter?.[1] ?? letter?.[2];
      push(`<div class="ln${item ? " item" : ""}"${item ? ` data-item="${item}"` : ""} style="--ind:${ind}">${marked.parseInline(lt)}</div>`);
    }
    if (!h && media.length) push(mediaHTML(media)); // .ln 行の直後に出す。見出し・表・フェンスは対象外
    const lead = m ? m[2].trim() : t; // "1. 🔴 …" の段見出しも拾う
    for (const [e, c] of PRI) if (lead.startsWith(e)) cur.pri.add(c);
  }
  const body = blocks.map((b) => {
    const pri = PRI.map(([, c]) => c).find((c) => b.pri.has(c)); // 赤 > 黄 > 緑
    return `<section class="blk${b.num ? "" : " nonum"}${/^[A-Z]$/.test(b.num ?? "") ? " alpha" : ""}${pri ? " pri-" + pri : ""}"${b.label ? ` data-label="${esc(b.label)}"` : ""}><div class="num">${esc(b.num ?? "")}</div><div class="body">${b.html.join("")}</div></section>`;
  }).join("");
  return body + (foot.length ? `<div class="foot">${foot.join("")}</div>` : "");
}

const shellArg = (arg) => /^[\w./-]+$/.test(arg) ? arg : "'" + arg.replaceAll("'", "'\\''") + "'";

// 話題は帯の時刻の後ろに出し、1px でも省略される時は帯のすぐ下の行に全文を出す。幅の数字で切らない (話題と repo 名の長さ・送信済の表示でも変わる)
function fitTopic() {
  const stamp = document.getElementById("stamp"), row = document.getElementById("topic"), topic = cur?.topic ?? "";
  stamp.querySelector("span")?.remove();
  const span = Object.assign(document.createElement("span"), { textContent: ` · ${topic}` });
  if (topic) stamp.append(span);
  const drop = !!topic && span.getBoundingClientRect().right > stamp.getBoundingClientRect().right;
  if (drop) span.remove();
  row.hidden = !drop;
  row.textContent = drop ? topic : "";
}

// 依頼の行。依頼文の無い返事には、同じ会話の 1 つ前の依頼を薄く出す (次に打つまで)。打った後は、返事を待つ間もその依頼に替える
function renderPrompt(e) {
  const ask = document.getElementById("ask"), own = e?.prompt || e?.next, q = own || (e?.askFrom && all.find((x) => x.name === e.askFrom)?.prompt) || "";
  const line = q && (own ? "依頼: " : "1 つ前の依頼: ") + q.replace(/\s+/g, " ");
  if (ask.firstChild.textContent === line && ask.lastChild.textContent === q) return; // 2 秒ごとに呼ばれる。選択中の文字を消さない
  ask.hidden = !q;
  ask.classList.toggle("prev", !own);
  ask.firstChild.textContent = line;
  ask.lastChild.textContent = q;
}

async function show(md, entry) {
  const el = document.getElementById("reply");
  stopSpeak(); // 返事が替わったら読み上げは止める
  mediaV = Date.now();
  const ansOn = !!entry?.notice?.decisions, cut2 = ansOn ? md.indexOf("\n\n**この問いを置いた時の返事**\n\n") : -1, [md1, md2] = cut2 < 0 ? [md, ""] : [md.slice(0, cut2), md.slice(cut2)];
  if (ansOn && askbox.parentNode === el) { for (const n of [...el.childNodes]) if (n !== askbox) n.remove(); askbox.insertAdjacentHTML("beforebegin", renderLowLoad(md1)); } // 箱を外さない (書いている途中の変換と焦点が切れる)
  else { el.innerHTML = md ? renderLowLoad(md1) : ""; if (ansOn) el.append(askbox); }
  if (md2) el.insertAdjacentHTML("beforeend", renderLowLoad(md2));
  if (entry?.sid && entry.cwd && !entry.codex) {
    const { sid, cwd } = entry;
    const footer = document.createElement("footer");
    const button = document.createElement("button");
    const label = "⧉ セッション " + sid.slice(0, 8);
    footer.className = "reply-session";
    button.type = "button";
    button.title = "再開コマンドをコピー";
    button.textContent = label;
    button.onclick = (ev) => {
      ev.stopPropagation();
      copyWithFeedback(button, `cd ${shellArg(cwd)} && claude --resume ${shellArg(sid)}`, label, "✓ コピーしました", "× コピーできませんでした");
    };
    footer.append(button);
    el.append(footer);
  }
  document.getElementById("ask").open = false;
  renderPrompt(entry);
  const time = entry?.ts ? new Date(entry.ts).toLocaleTimeString("ja-JP", { hour12: false }) : "";
  document.getElementById("stamp").textContent = entry ? agentTag(entry) + (entry.codexPane ? [entry.label, entry.repo, entry.title] : [entry.notice ? `item ${entry.notice.number}` : entry.repo || "?", time]).filter(Boolean).join(" · ") : "";
  cur = entry;
  fitTopic();
  renderChat();
  document.getElementById("sent").textContent = "";
  document.getElementById("akmsg").textContent = sendingNotes.has(curName()) ? "送信中…" : "";
  if (!entry?.notice) decorate(el, !entry?.codexPane); // Codex の状態表示 (待機中・作業中) は返事でないので段落の印を付けない
  fitPre();
  refresh();
  try { await mermaid.run({ nodes: el.querySelectorAll("pre.mermaid") }); }
  finally { if (!entry?.notice) decorateDiagrams(el); refresh(); scheduleMargin(); } // 図のノードは描画後にしか無い。同じ返事の描き直しでもピンの赤枠を戻す
}

// 履歴: list[0] が最新。following = 最新を見ている間は新着で自動的に差し替える。
// all = /history の全件 (プロジェクト列のため常に絞らずに取る)、list = そのうち選択中プロジェクト (?repo=) かつセッション (?s=) の分。
// ← → と追従は list の中だけで動く。
let all = [], list = [], idx = 0, following = true, shownName = null, showRequest = 0;
let botPerms = [];
// Bot の完了・判断待ちの知らせ (name が botitem-)。all に混ぜず、行を押した時だけ本文に出す。開いている分は一覧から消えても持っておく (読んでいる途中で本文が消えない)
let botNotes = [], noteMore = false, noteBack = { sess: "", name: null, follow: true, why: "", at: "" }; // noteBack = もう一度押した時に戻る表示 (name は前の返事を見ていた時と、書きかけの赤ペンがある時だけ)
const noteSession = (s) => s.startsWith("botitem-");
const params = new URLSearchParams(location.search);
let SESS = params.get("s") || ""; // "" = 最新 (最後に返事したセッションを追う)
let REPO = params.get("repo") || ""; // "" = すべて
// モード: main = 本体の返事だけ / agents = subagent の返事 (entry.agent あり) だけ。混ぜない (2026-09-29 user)。
// inRepo で落とす = 一覧・← →・追従・chip・送り先リスト・プロジェクト列がモードの entry だけを見る。?mode=agents に残す (localStorage には持たない = 開けば main)
let AGENTS = params.get("mode") === "agents";
const inMode = (e) => !!e.agent === AGENTS;
const agentTag = (e) => (e?.bot ? `${e.agent ? "🤖 " : ""}${e.bot}: ` : e?.agent ? `🤖 ${String(e.agent.type ?? "").split(":").pop() || "agent"}: ` : e?.codex ? "Codex: " : ""); // "claude-code-harness:worker" → "🤖 worker: "
// ponytail: repo の照合は cwd basename の完全一致 (大文字小文字は無視) だけ。上限 = 1 repo ずつ切り替えて見る用途。
const inRepo = (es) => es.filter((e) => inMode(e) && (!REPO || e.repo.toLowerCase() === REPO.toLowerCase()));
// repo 名 → 決定的な色 (文字列 hash → hue)。照合と同じく大文字小文字は無視
const repoColor = (r) => { let h = 0; for (const c of String(r ?? "").toLowerCase()) h = (h * 31 + c.codePointAt(0)) >>> 0; return `hsl(${h % 360} 55% 55%)`; };
const rcDot = '<i class="rc">●</i>';
const inSess = (es) => (SESS ? es.filter((e) => e.session === SESS) : es);
const codexPaneSession = (s) => s.startsWith("codex-pane-");
const scope = () => {
  if (noteSession(SESS)) return botNotes.filter((e) => e.session === SESS);
  const entries = inRepo(all);
  const pane = entries.find((e) => e.codexPane && e.session === SESS);
  if (pane?.sid) {
    const replies = all.filter((e) => e.codex && !e.codexPane && e.sid === pane.sid);
    if (replies.length) return replies.map((e) => ({ ...e, livePane: pane.name }));
  }
  return inSess(entries).filter((e) => SESS || !e.codexPane);
};
const setParam = (k, v) => { const u = new URL(location.href); if (v) u.searchParams.set(k, v); else u.searchParams.delete(k); history.replaceState(null, "", u); };
function renderBar() {
  document.getElementById("pos").textContent = list.length ? `${list.length - idx} / ${list.length}` : "";
  document.getElementById("prev").disabled = idx >= list.length - 1;
  document.getElementById("next").disabled = idx <= 0;
}
async function showIdx(i) {
  idx = Math.max(0, Math.min(i, list.length - 1));
  following = idx === 0;
  const e = list[idx];
  renderBar();
  if (e && e.name === cur?.name) renderPrompt(e);
  const samePaneBody = cur?.replyTurn === e?.replyTurn && (!!e?.replyTurn || cur?.status === e?.status);
  if (!e || (e.name === shownName && e.livePane === cur?.livePane && (!e.codexPane || samePaneBody))) return;
  const request = ++showRequest;
  shownName = e.name;
  renderChat();
  if (cur?.codex) renderTray();
  let md;
  try {
    const reply = await fetch(`/history/${encodeURIComponent(e.name)}`, { cache: "no-store" });
    if (!reply.ok && !e.codexPane) throw new Error(`history: ${reply.status}`);
    md = await reply.text();
  } catch (err) {
    if (request === showRequest && shownName === e.name) { shownName = null; renderChat(); if (cur?.codex) renderTray(); }
    throw err;
  }
  if (request === showRequest && shownName === e.name) await show(md, e);
}
// #dbg 付きの時だけ: ← → の後 24 コマの高さの値を state/dbg.jsonl へ送る (スマホのちらつきを実機で捕まえる。直し方 2 回が当て推量で外れた、2026-11-15)
function traceSwitch() {
  if (!location.hash.includes("dbg")) return;
  const rows = [], t0 = performance.now(), vv = window.visualViewport, r = Math.round, chat = document.getElementById("chat"), reply = document.getElementById("reply");
  const tick = () => {
    const c = chat.getBoundingClientRect();
    rows.push([r(performance.now() - t0), r(document.body.getBoundingClientRect().height), parseInt(document.documentElement.style.getPropertyValue("--vvh")) || 0, r(c.top), r(c.bottom), vv ? r(vv.height) : 0, vv ? +vv.scale.toFixed(2) : 0, vv ? r(vv.offsetTop) : 0, innerHeight, r(mainEl.scrollTop), r(reply.getBoundingClientRect().height)]);
    if (rows.length < 24) return requestAnimationFrame(tick);
    fetch("/dbg", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ trace: "switch", cols: "t bodyH vvh chatT chatB vvH scale vvTop innerH scroll replyH", rows }) }).catch(() => {});
  };
  requestAnimationFrame(tick);
}
const older = () => { traceSwitch(); return showIdx(idx + 1); };
const newer = () => { traceSwitch(); return showIdx(idx - 1); };
// 読み上げ: 描画済み本文から、コード・表・図・画像・ボタン等の UI 部品を除いた文字だけを読む。もう一度押すと止まる。
// 声は server の /speak (Gemini TTS)。1 つ目のチャンクで失敗したら (キー無し等) ブラウザ内蔵の speechSynthesis で全文を読む
const speakBtn = document.getElementById("speak");
// 再生速度 (声の高さは変えない) は 🔊 の隣の select。選んだ値を localStorage "rmx.ttsRate" に覚える
const rateSel = document.getElementById("rate");
try { rateSel.value = localStorage.getItem("rmx.ttsRate") || "2"; } catch {}
if (!rateSel.value) rateSel.value = "2"; // 覚えた値が選択肢に無い時
const ttsRate = () => +rateSel.value;
rateSel.onchange = () => {
  try { localStorage.setItem("rmx.ttsRate", rateSel.value); } catch {}
  if (speaking?.audio) speaking.audio.playbackRate = ttsRate(); // 鳴っている Gemini の声にもすぐ効かせる (内蔵の声は次の読み上げから)
};
let speaking = null; // 読み上げ中の 1 回分: Gemini = { ctl: AbortController, audio } / 予備 = SpeechSynthesisUtterance
let paused = false, onResume = null; // 一時停止中か / 一時停止中に Gemini の次チャンクが再開を待つ resolve
const resumed = () => paused && new Promise((r) => (onResume = r));
function stopSpeak() {
  if (!speaking) return;
  const s = speaking;
  speaking = null; // 止めた後に届く onend / onerror / fetch の結果は、speaking が変わっているので無視される
  if (s.ctl) { s.ctl.abort(); s.audio?.pause(); }
  else { speechSynthesis.cancel(); if (paused) speechSynthesis.resume(); } // pause のまま cancel すると次の speak も止まったままになるので解く
  paused = false; onResume?.(); onResume = null; // 再開待ちの loop を起こして抜けさせる

    if (chatTo()?.codexPane || codexPaneSession(SESS) || noteSession(SESS)) return; // 知らせへの答えのつもりの y で、別の会話を許可しない
    const bs = [...tstat.querySelectorAll("[data-approve]:not(:disabled)")];
    const b = bs.find((x) => x.dataset.approve === chatTo()?.session) ?? (bs.length === 1 ? bs[0] : null);
    if (b) { ev.preventDefault(); b.click(); }
    return;
  }
  if (ev.key === "r" && !speakBtn.hidden) return toggleSpeak(); // r = 読み上げ (他のキーと重ならない)
  // Esc (欄の外) = 1 回ごとに新しいピンから外す。ひとことが書いてあるピンに当たったら止める (打った文字は消さない)
  if (ev.key === "Escape") {
    const pins = drafts.get(curName())?.pins, last = pins && [...pins.keys()].pop();
    if (last != null && !keepPin(drafts.get(curName()), last)) { pins.delete(last); refresh(); }
    return;
  }
  if (ev.key === "ArrowLeft") { ev.preventDefault(); older(); }
  else if (ev.key === "ArrowRight") { ev.preventDefault(); newer(); }
});

// 赤ペン: 段 (N.) / 項目 (ⅰ〜) / 表の行をクリックでピン留めし、ひとことを添えて返事を出した Orca 端末へ送る。
// 下書きは表示中の返事ごとに drafts (name → 下書き) に持つ。← → で行き来しても消えない。
// ponytail: 下書きはメモリだけ (リロードで消える)。上限 = 1 タブで書いてすぐ送る用途。
const drafts = new Map();
const sendingNotes = new Set();
let pageVer = null; // 読み込んだ index.html の版 (/history の x-rmv-page)
let cur = null; // 表示中の履歴 entry。latest.html だけ映している間は null (送信不可・コピーのみ)
const curName = () => cur?.name ?? "";
const canSendNotes = () => {
  if (noteSession(SESS)) return false; // 本文の取得中は cur が前の返事のまま
  if (!cur?.codex) return !!cur?.terminal;
  if (cur.codexPane || cur.name !== shownName || cur.name !== list[idx]?.name || cur.livePane !== list[idx]?.livePane) return false;
  return !cur.livePane || all.some((e) => e.codexPane && e.name === cur.livePane && e.sid === cur.sid);
};
const draftOf = (n) => { if (!drafts.has(n)) drafts.set(n, { pins: new Map(), free: "", imgs: [] }); return drafts.get(n); };
// 空のひとことでも写真が付いていれば外さない (Esc 1 回で写真だけの一言を失わせない)
const keepPin = (d, k) => !!d.pins.get(k)?.comment.trim() || d.imgs.some((i) => i.pin === k);
const hasDraft = (n) => { const d = drafts.get(n ?? ""); return !!d && (d.pins.size > 0 || !!d.free.trim() || d.imgs.length > 0); };
const cut = (s, n) => { const t = s.replace(/\s+/g, " ").trim(); return t.length > n ? t.slice(0, n) + "…" : t; };
const textOf = (el) => {
  const c = el.cloneNode(true);
  if (c.classList.contains("para")) return [...c.children].map((line) => line.textContent).join(" ");
  return el.tagName === "TR" ? [...c.cells].map((td) => td.textContent.trim()).join(" | ") : (c.querySelector(".body") ?? c).textContent;
};
const hhmm = (d) => d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit", hour12: false });

// スマホ: 案表を行ごとのカードにする。DOM は表のまま、列ごとの役割の class と見出しの文字 (data-th) を足して CSS で並べる。
// 列名は決め打ちしない (人によって違う): 1 列目 = 記号 / 2 列目 = 題 / 3 列目以降で値が全部 SS・S・A〜D の列 = 右上の印 / それ以外の最後の列 = 理由 / 残りは見出しつきで 2 行目
const GRADE = /^(SS|[SABCD])[+-]?$/;
function cardify(t) {
  const heads = [...(t.tHead?.rows[0]?.cells ?? [])].map((c) => c.textContent.trim()), rows = [...t.tBodies[0].rows], n = heads.length;
  let badge = -1;
  for (let j = n - 1; j >= 2 && badge < 0; j--) if (rows.every((r) => GRADE.test(r.cells[j]?.textContent.trim() ?? ""))) badge = j;
  const reason = [n - 1, n - 2].find((j) => j >= 2 && j !== badge) ?? -1;
  t.classList.add("cards");
  rows.forEach((r) => {
    [...r.cells].forEach((c, j) => { c.className = j === 0 ? "ck" : j === 1 ? "ct" : j === badge ? "cb" : j === reason ? "cr" : "cm"; c.dataset.th = heads[j] ?? ""; });
  });
}
// スマホ: 幅を超える罫線図・コードは、収まるまで字を小さくする (下限 9px)。下限でも収まらない物は元の大きさで横スクロールのまま (長い 1 行のコードを 9px にしても読めない)
// 幅が変わった時 (Fold の開閉) とフォントが届いた時にも測り直す
function fitPre() {
  if (!isMobileUA) return;
  for (const p of document.querySelectorAll("#reply pre:not(.mermaid)")) {
    p.style.removeProperty("--pf");
    if (p.scrollWidth <= p.clientWidth) continue;
    const cs = getComputedStyle(p), pad = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    let f = Math.floor(parseFloat(cs.fontSize) * (p.clientWidth - pad) / (p.scrollWidth - pad) * 10) / 10;
    for (; f >= 9; f = Math.round((f - 0.3) * 10) / 10) { p.style.setProperty("--pf", f + "px"); if (p.scrollWidth <= p.clientWidth) break; }
    if (f < 9) p.style.removeProperty("--pf");
  }
}
addEventListener("resize", fitPre);
document.fonts?.ready.then(fitPre);
document.fonts?.addEventListener("loadingdone", fitPre);

// 描画後の DOM に錨を付ける: data-anchor = 表示名 (2 / 2-ⅱ / 表 A)、data-pin = 返事内の通し番号 (本文は不変なので番号で同定できる)
function decorate(el, paras) {
  el.querySelectorAll(".blk").forEach((b) => {
    const a = b.classList.contains("nonum") ? b.dataset.label : b.querySelector(".num").textContent;
    if (a) b.dataset.anchor = a; // 見出しの無い番号なし段 (返事冒頭など) は従来どおり対象外
  });
  // 空行で区切った普通の段落も印の対象にする (表の下の "d61: …" の段落が直前の番号段落ごとにしか選べなかった)。
  // 錨のある段は 2 つ目以降のかたまりだけ (最初のかたまりは段の印と同じ)、名前は行頭の "d61:" の語、無ければ 2-段落N。
  // 錨の無い段 (返事の冒頭、Codex の返事) は全部包み、名前は返事全体の通し番号の 段落 N。ⅰ の項目・表・コードは包まない
  let n = 0;
  if (paras) el.querySelectorAll(".blk").forEach((b) => {
    const a = b.dataset.anchor;
    let paragraph, k = 1;
    for (const line of b.querySelectorAll(":scope > .body > .ln:not(.item):not(.head)")) {
      const prev = line.previousElementSibling;
      if (paragraph && prev === paragraph) { paragraph.append(line); continue; }
      paragraph = null;
      if (a && !prev?.classList.contains("gap")) continue; // 空行を挟まない続きの行は前の段・項目のうち
      const key = line.textContent.match(/^([\w-]{1,16})[:：](?!\/)/)?.[1], no = ++k;
      paragraph = document.createElement("div");
      paragraph.className = "para";
      paragraph.dataset.anchor = a ? `${a}-${key ?? `段落${no}`}` : `段落 ${++n}`;
      line.before(paragraph);
      paragraph.append(line);
    }
  });
  el.querySelectorAll(".ln.item").forEach((it) => {
    const n = it.closest(".blk")?.dataset.anchor;
    const r = it.dataset.item;
    it.dataset.anchor = n ? `${n}-${r}` : r;
  });
  const isPickRow = (tr) => /^[A-E]$/.test(tr.cells[0]?.textContent.trim() ?? "");
  const pickTbls = [...el.querySelectorAll("table")].filter((t) => [...t.querySelectorAll("tbody tr")].some(isPickRow)); // Low-Load の案表
  pickTbls.forEach((t, i) => { t.dataset.ptbl = String(i); });
  el.querySelectorAll("table tbody tr").forEach((tr) => {
    const first = tr.cells[0]?.textContent.trim() ?? "";
    tr.dataset.anchor = `表 ${cut(first, 12)}`;
  });
  if (isMobileUA) pickTbls.forEach(cardify);
  el.querySelectorAll("[data-anchor]").forEach((x, i) => { x.dataset.pin = String(i); x.classList.add("pinable"); });
}

// 図のノード (flowchart / state のノード、sequence の登場人物と矢印の文言) に錨を付ける。
// data-pin = "図:<ラベル>#<返事内で同じラベルが何回目か>": 同じ返事を描き直しても同じキーになる (登場人物は上下 2 回出るので #0 / #1)
function decorateDiagrams(el) {
  const seen = new Map();
  el.querySelectorAll("pre.mermaid").forEach((pre) => {
    const svg = pre.querySelector("svg");
    if (!svg) return; // 描画に失敗した図
    if (!pre.querySelector(".mmzoom")) pre.insertAdjacentHTML("beforeend", '<button class="mmzoom" title="全画面で見る">⤢</button>');
    svg.querySelectorAll("g.node, text.actor, text.messageText").forEach((n) => {
      const label = n.textContent.replace(/\s+/g, " ").trim();
      if (!label) return; // 開始・終了の丸
      const x = n.matches("text.actor") && n.parentNode.querySelector("rect.actor") ? n.parentNode : n; // 登場人物は箱ごと
      const i = seen.get(label) ?? 0;
      seen.set(label, i + 1);
      x.dataset.anchor = `図: ${cut(label, 20)}`;
      x.dataset.pin = `図:${label}#${i}`;
      x.classList.add("pinable");
    });
  });
}

function applyMarks() {
  const d = drafts.get(curName());
  document.querySelectorAll("#reply [data-pin]").forEach((x) => {
    const on = !!d?.pins.has(x.dataset.pin);
    x.classList.toggle("pinned", on);
    if (x.classList.contains("blk") || x instanceof SVGElement) return; // 段は丸番号、図のノードは赤枠 (CSS) だけ
    const host = x.tagName === "TR" ? x.cells[0] : x.classList.contains("para") ? x.firstElementChild : x; // 段落の札は 1 行目の頭に (段落の上に札だけの行を足すと本文が下にずれる)
    if (on) host.dataset.badge = x.dataset.anchor; else delete host.dataset.badge;
  });
}

function stackNotes(items, gap) {
  let floor = 0;
  return items.map(({ top, h }) => {
    const placed = top == null ? floor : Math.max(top, floor);
    floor = placed + h + gap;
    return placed;
  });
}

const pinNodes = new WeakMap();
let marginFrame = 0, composingPin = false;
const margin = document.getElementById("margin"), pinsEl = document.getElementById("pins"), mainEl = document.querySelector("main");
const marginResize = new ResizeObserver(() => scheduleMargin());
const pinNode = (p, k) => {
  let node = pinNodes.get(p);
  if (node) return node;
  node = document.createElement("div"); node.className = "pin";
  node.dataset.k = k;
  const b = document.createElement("b"), q = document.createElement("span"), field = document.createElement("textarea"), a = document.createElement("button"), x = document.createElement("button");
  b.textContent = p.anchor; b.title = b.textContent;
  q.className = "q"; q.textContent = `「${p.quote}」`;
  field.rows = 1; field.placeholder = "ひとこと"; field.value = p.comment;
  x.dataset.x = k; x.title = "外す"; x.textContent = "×";
  a.className = "pa"; a.dataset.pa = k; a.title = "写真・動画・PDF を添付 (欄に貼り付け・ドロップでも)"; a.textContent = "📎";
  node.append(b, q, field, a, x); pinNodes.set(p, node);
  return node;
};
const movePin = (node, parent, before) => {
  if (node.parentElement === parent) return;
  const active = node.contains(document.activeElement) && document.activeElement instanceof HTMLTextAreaElement ? document.activeElement : null;
  const start = active?.selectionStart, end = active?.selectionEnd, direction = active?.selectionDirection;
  parent.insertBefore(node, before ?? null);
  if (active) { active.focus({ preventScroll: true }); active.setSelectionRange(start, end, direction); }
};
const marginAnchor = (entry) => document.querySelector(`#reply [data-pin="${CSS.escape(entry.k)}"]`);
const scheduleMargin = () => { if (!marginFrame) marginFrame = requestAnimationFrame(() => { marginFrame = 0; layoutMargin(); }); };
function layoutMargin() {
  if (composingPin) return;
  const d = drafts.get(curName()), desktop = document.documentElement.classList.contains("wide") && !document.documentElement.classList.contains("narrow");
  if (margin.hidden === desktop) margin.hidden = !desktop;
  // 測る値 (getBoundingClientRect) は html の zoom を掛けた見た目の px、書く style.top / height と scrollTop は掛ける前の px。z で割って揃える (2026-11-15 user「X軸がずれる」: zoom 0.9 でカードが行より上、1.2 で下に出ていた)
  const z = parseFloat(document.documentElement.style.zoom) || 1, h = (node) => node.getBoundingClientRect().height / z;
  const available = desktop && margin.getBoundingClientRect().width / z >= 160;
  const entries = d ? [...d.pins].map(([k, p]) => ({ k, p })) : [];
  const mainRect = mainEl.getBoundingClientRect(), placed = [], fallback = [];
  entries.forEach((entry) => {
    entry.node = pinNode(entry.p, entry.k);
    const anchor = available && marginAnchor(entry);
    if (anchor && anchor.getBoundingClientRect().height > 0) {
      entry.anchor = anchor; entry.top = (anchor.getBoundingClientRect().top - mainRect.top) / z + mainEl.scrollTop;
      placed.push(entry);
    } else fallback.push(entry);
  });
  const live = new Set(entries.map((entry) => entry.node));
  [...margin.children, ...pinsEl.children].forEach((node) => { if (!live.has(node)) { marginResize.unobserve(node); node.remove(); } });
  document.body.classList.toggle("rp-margin", !!entries.length && !fallback.length);
  // ponytail: 既存カードを並べ替えず、新規カードだけ文書順の位置へ差し込む。
  placed.sort((a, b) => a.anchor === b.anchor ? 0 : (a.anchor.compareDocumentPosition(b.anchor) & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1)).forEach((entry) => { movePin(entry.node, margin, [...margin.children].find((n) => (+n.style.top || 0) > entry.top)); marginResize.observe(entry.node); });
  fallback.forEach((entry) => {
    movePin(entry.node, pinsEl); marginResize.observe(entry.node);
  });
  const tops = stackNotes(placed.map((entry) => ({ top: entry.top, h: h(entry.node) })), 4);
  tops.forEach((top, i) => { const v = `${top}px`; if (placed[i].node.style.top !== v) placed[i].node.style.top = v; });
  const height = placed.length ? `${tops[tops.length - 1] + h(placed[placed.length - 1].node) + 32}px` : "0px";
  if (margin.style.height !== height) margin.style.height = height;
  margin.hidden = !placed.length;
}

let penFold = false; // スマホ: 赤ペン欄を畳んでいる
function renderTray() {
  const d = drafts.get(curName());
  const tray = document.getElementById("tray");
  tray.hidden = !d || !d.pins.size;
  if (isMobileUA) { // 畳んでいる間 (penFold) は帯に『赤ペン N』を出す。赤ペンが空になったら畳みも解く
    if (tray.hidden) penFold = false;
    document.body.classList.toggle("pen", !tray.hidden && !penFold);
    const dpen = document.getElementById("dpen"); dpen.hidden = !penFold; dpen.querySelector("b").textContent = d ? d.pins.size : "";
    placeNav();
  } // スマホ: 赤ペン中は下の欄を赤ペン欄に入れ替える (送信欄と 2 段に積まない)
  scheduleMargin();
  const free = document.getElementById("free");
  if (free.value !== (d?.free ?? "")) free.value = d?.free ?? "";
  if (d) { // 外れたピンの写真も外す (その場で詰める: 積んでいる途中の addImages が同じ配列を持っている)
    for (let i = d.imgs.length - 1; i >= 0; i--) if (d.imgs[i].pin != null && !d.pins.has(d.imgs[i].pin)) { URL.revokeObjectURL(d.imgs[i].url); d.imgs.splice(i, 1); }
    d.pins.forEach((p, k) => { const n = d.imgs.filter((i) => i.pin === k).length, a = pinNode(p, k).querySelector(".pa"); a.textContent = n ? `📎${n}` : "📎"; a.classList.toggle("on", n > 0); });
  }
  const fimgs = document.getElementById("fimgs");
  fimgs.hidden = !(d?.imgs.length);
  fimgs.innerHTML = d?.imgs.map((p, i) => `<span class="cimg">${thumb(p)}${p.pin != null ? `<i class="pk">${esc(d.pins.get(p.pin)?.anchor ?? "")}</i>` : ""}<button data-i="${i}" title="外す">×</button></span>`).join("") ?? "";
  const send = document.getElementById("send");
  send.disabled = sendingNotes.has(curName()) || !canSendNotes();
  send.title = cur?.bot ? "Bot の会話へ手紙で送る" : cur?.codex ? "Codex の会話のキューに積む (文字だけ)" : cur?.terminal ? "返事を出した端末へ打ち込む" : "この返事は Orca / herdr の外で出たので送れません。コピーして貼ってください";
}
const refresh = () => { applyMarks(); renderTray(); };

function message(d) {
  const head = cur?.ts ? `【赤ペン】(${hhmm(new Date(cur.ts))} の返事へ)` : "【赤ペン】";
  // ピンの写真はそのピンの行の直下に 1 行 1 枚のパスで置く (クリップボードの [Image #N] ではどのピンの写真か届かない)
  const pins = [...d.pins].flatMap(([k, p]) => [`${p.anchor}「${p.quote}」${p.comment.trim() ? `→ ${p.comment.trim()}` : ""}`, ...d.imgs.filter((i) => i.pin === k).map((i) => `  📎 ${i.path}`)]);
  return [head, ...pins, d.free.trim()].filter(Boolean).join("\n");
}

async function copyWithFeedback(button, text, label = "⧉", done = "✓", failed = "×") {
  let feedback = done;
  try {
    if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(text);
    else {
      // HTTP では Clipboard API が無いので、クリック中にブラウザのコピーを実行する。
      const active = document.activeElement;
      const field = document.createElement("textarea");
      field.value = text;
      field.readOnly = true;
      field.style.cssText = "position:fixed;top:0;left:0;opacity:0";
      document.body.append(field);
      try {
        field.select();
        if (!document.execCommand("copy")) feedback = failed;
      } finally {
        field.remove();
        active?.focus({ preventScroll: true });
      }
    }
  } catch {
    feedback = failed;
  }
  button.textContent = feedback;
  setTimeout(() => (button.textContent = label), 1200);
}

document.getElementById("reply").addEventListener("click", (ev) => {
  const im = ev.target.closest(".media img");
  if (im) { zoomSet = [...document.querySelectorAll("#reply .media img")]; return zoomGallery(zoomSet.indexOf(im)); } // 画像は mermaid と同じ全画面 (ホイール拡大・ドラッグ・Esc・← →)
  const cb = ev.target.closest(".cpbtn");
  if (cb) return copyWithFeedback(cb, cb.previousElementSibling.textContent.replace(/\n$/, ""));
  // パスのリンク: 普通のクリックで既定アプリ (open 型) / ⌥クリックで Finder に表示 (open 型も /file 型も)。⌥クリックの既定動作 (Chromium はリンク先をダウンロードする) は止める
  const pa = ev.target.closest("a");
  const pp = pa?.dataset.open ?? (ev.altKey && pa?.getAttribute("href")?.startsWith("/file?p=") ? new URL(pa.href).searchParams.get("p") : null);
  if (pp) {
    ev.preventDefault();
    fetch("/open", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ p: pp, reveal: ev.altKey }) })
      .then(async (res) => { if (!res.ok) pa.title = await res.text(); }, (e) => { pa.title = String(e); }); // 失敗は title に出す
    return;
  }
  if (ev.target.closest("a, input, textarea, iframe, .media")) return; // 画像・動画・音声の操作でピンを付けない
  const d = draftOf(curName());
  const mm = ev.target.closest("pre.mermaid");
  if (mm?.querySelector("svg") && (ev.target.closest(".mmzoom") || !ev.target.closest("svg [data-pin]"))) return openZoom(mm.querySelector("svg")); // 図の空き地 / ⤢
  if (String(getSelection())) return; // 文字を選択している最中はピンにしない
  const t = ev.target.closest("[data-pin]");
  if (!t) return;
  const k = t.dataset.pin;
  if (d.pins.has(k)) d.pins.delete(k);
  else { d.pins.set(k, { anchor: t.dataset.anchor, quote: cut(textOf(t), 30), comment: "" }); penFold = false; } // 新しく付けたら畳んだ欄も開く
  refresh();
  const p = d.pins.get(k);
  if (p) requestAnimationFrame(() => { if (drafts.get(curName())?.pins.get(k) === p) pinNode(p, k).querySelector("textarea")?.focus(); });
});
const pinInput = (ev) => {
  const k = ev.target.closest("[data-k]")?.dataset.k;
  const p = k != null && drafts.get(curName())?.pins.get(k);
  if (p) { p.comment = ev.target.value; scheduleMargin(); }
};
// Esc (ひとこと欄): 空ならそのピンを外す / 書きかけなら欄を抜けるだけ (打った文字は消さない)。Enter だけでは改行しない (1 行欄だった頃と同じ)、Shift+Enter で改行
const pinKeydown = (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing && ev.target.tagName === "TEXTAREA") return ev.preventDefault();
  if (ev.key !== "Escape" || ev.target.tagName !== "TEXTAREA") return;
  ev.preventDefault();
  const d = draftOf(curName()), k = ev.target.closest("[data-k]").dataset.k;
  if (keepPin(d, k)) return ev.target.blur();
  d.pins.delete(k);
  refresh();
};
const pinClick = (ev) => {
  const pa = ev.target.closest("[data-pa]");
  if (pa) { const n = curName(), d = draftOf(n), k = pa.dataset.pa; fileTo = { n, d, k, p: d.pins.get(k) }; return ffile.click(); } // 押した時の下書きとピンに固定する
  const x = ev.target.closest("[data-x]");
  if (!x) return;
  const d = draftOf(curName());
  d.pins.delete(x.dataset.x);
  refresh();

// 表示 = 送り先セッションの今の値 (server の /now: transcript の最後の /model・/effort と assistant 行、model は無ければ settings.json)。送り先が変わった時と新しい返事が来た時に取り直す
// ponytail: 端末で直接 /model を打った分は次の返事まで古い表示。上限 = 返事ごとの 1 回の取得で足りる間
// モデルの候補は既定 4 つ。state/keys.json の "models": ["sonnet[1m]", ...] がその並びで置き換える (renderKeys が読む)
const MODELS_DEFAULT = ["sonnet", "opus", "haiku", "fable"];
const PICKS = { model: MODELS_DEFAULT, effort: ["low", "medium", "high", "xhigh", "max"] };
const nowVal = { model: null, effort: null }; // 表示する今の値。候補に無ければ候補の先頭に足す
// スマホ: 最下段を 1 行に収めるため、モデルは頭 3 文字、エフォートは頭文字で出す (送る値は元のまま、2026-11-13 user「fab, opu, son / h m xh」。[1m] の印は「ほぼ無用」で出さない)
const EFFORT_ABBR = { low: "l", medium: "m", high: "h", xhigh: "xh", max: "max" };
const pickAbbr = (c, x) => c === "effort" ? EFFORT_ABBR[x] ?? x : x.slice(0, 3);
function fillPick(sel) {
  const c = sel.dataset.cmd, v = nowVal[c], l = PICKS[c];
  sel.replaceChildren(sel.firstElementChild, ...(v && !l.includes(v) ? [v, ...l] : l).map((x) => new Option(isMobileUA ? pickAbbr(c, x) : x, x)));
  sel.value = v ?? ""; // 代入は change を出さないので打ち込みは走らない
}
async function switchTo(sel) {
  const to = chatTo(), say = document.getElementById("cmsg"), c = sel.dataset.cmd, v = sel.value;
  sel.blur(); // 選んだ後もフォーカスが残ると ↑↓ が送り先の切り替えと取り合う
  if (!v || !to?.terminal || to.codex || to.bot || chatBusy) return fillPick(sel);
  chatBusy = true;
  say.textContent = "";
  renderChat();
  try {
    const r = await fetch("/switch", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name: to.name, cmd: c, value: v }) });
    if (!r.ok) throw new Error((await r.text()) || String(r.status));
    nowVal[c] = v;
  } catch (e) { say.textContent = `${c} を切り替えなかった: ${String(e.message ?? e).replace(/ \(.*\)$/, "")}`; } // 末尾の括弧 (/rmp の合図向けの説明) は落とす
  chatBusy = false;
  renderChat();
  fillPick(sel);
}
document.querySelectorAll("#cact .cpick").forEach((sel) => { fillPick(sel); sel.onchange = () => switchTo(sel); });
// context 使用量: 「268k / 1M」、30% 以上で黄・50% 以上で赤、割合は title。null なら出さない
const cctx = document.getElementById("cctx");
const kfmt = (n) => n >= 1e6 ? +(n / 1e6).toFixed(1) + "M" : Math.round(n / 1e3) + "k";
function showCtx(c) {
  const ok = c && c.used >= 0 && c.limit > 0, pct = ok ? c.used / c.limit * 100 : 0;
  cctx.textContent = ok ? `${kfmt(c.used)} / ${kfmt(c.limit)}` : "";
  cctx.title = ok ? `${pct.toFixed(1)}% 使用` : "";
  cctx.className = pct >= 50 ? "crit" : pct >= 30 ? "warn" : "";
}
let nowFor;
async function loadNow(to) {
  const name = to?.name ?? null;
  if (name === nowFor) return;
  nowFor = name;
  let r = {};
  try { if (name && !to.codex && !to.bot) r = await (await fetch("/now?name=" + encodeURIComponent(name))).json(); } catch {}
  if (nowFor !== name) return; // 取っている間に送り先が変わった
  nowVal.model = r.model || null; nowVal.effort = r.effort || null;
  showCtx(r.ctx);
  document.querySelectorAll("#cact .cpick").forEach(fillPick);
}
// 6〜0 は好きなコマンドを置く枠。既定は KEYS_DEFAULT で、state/keys.json の同じ番号が上書きする ("" で消す。1〜5 も上書きできる)
const KEYS_DEFAULT = { 6: "/compact", 7: "/exit" };
function renderKeys(m) {
  const ms = Array.isArray(m.models) ? m.models.filter((v) => typeof v === "string" && v.trim()) : [];
  PICKS.model = ms.length ? ms : MODELS_DEFAULT; fillPick(document.querySelector('#cact .cpick[data-cmd=model]'));
  const all = { ...KEYS_DEFAULT, ...m }, ok = (k) => typeof all[k] === "string" && all[k];
  const label = (b, k) => { b.dataset.k = k; b.dataset.t = all[k]; b.title = `${all[k]} を送る (${k})`; b.replaceChildren(all[k], Object.assign(document.createElement("sup"), { textContent: k })); };
  document.querySelectorAll("#cact > .q").forEach((b) => ok(b.dataset.k) && label(b, b.dataset.k));
  const to = chatTo();
  document.getElementById("copt").replaceChildren(...["6", "7", "8", "9", "0"].filter(ok).map((k) => { const b = Object.assign(document.createElement("button"), { className: "q", disabled: csend.disabled || !!(to?.codex || to?.bot) }); label(b, k); return b; }));
}
renderKeys({});
fetch("/keys").then((r) => r.json()).then(renderKeys).catch(() => {});
// "/" 補完: 入力が ^/(\S*)$ の間だけ候補 (server /skills) を出す。取得は送り先 (cwd) が変わった時か 60 秒経過で 1 回。
const sug = document.getElementById("sug");
let skillList = [], skillCwd = null, skillAt = 0, sugItems = [], sugI = 0;
async function loadSkills() {
  const to = chatTo();
  if (!to?.terminal || to.codex || to.bot) return;
  const cwd = to.cwd ?? "";
  if (skillCwd === cwd && Date.now() - skillAt < 60000) return;
  skillCwd = cwd; skillAt = Date.now();
  try { skillList = await (await fetch("/skills" + (cwd ? "?cwd=" + encodeURIComponent(cwd) : ""))).json(); } catch { skillList = []; }
  renderSug();
}
function renderSug() {
  const m = ctext.value.match(/^\/(\S*)$/);
  const to = chatTo();
  if (!m || !to?.terminal || to.codex || to.bot) { sugItems = []; sug.hidden = true; return; }
  const q = m[1].toLowerCase();
  let hit = skillList.filter((s) => s.name.toLowerCase().startsWith(q));
  if (!hit.length) hit = skillList.filter((s) => s.name.toLowerCase().includes(q));
  sugItems = hit.slice(0, 12);
  sugI = Math.min(sugI, Math.max(sugItems.length - 1, 0));
  sug.hidden = !sugItems.length;
  sug.innerHTML = sugItems.map((s, i) => `<div data-i="${i}"${i === sugI ? ' class="on"' : ""}><b>${esc(s.name)}</b><span>${esc(s.desc)}</span></div>`).join("");
}
const pickSug = (i) => { ctext.value = `/${sugItems[i].name} `; sugItems = []; sug.hidden = true; ctext.focus(); };
ctext.addEventListener("input", () => { sugI = 0; loadSkills(); renderSug(); });
ctext.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && !ev.isComposing && sug.hidden) { ev.preventDefault(); return ctext.blur(); } // Esc = 欄を抜ける (打った文字は消さない。変換中は変換の取り消し、候補が出ている時は候補を閉じるのが先)
  if (sug.hidden || ev.metaKey || ev.ctrlKey) return;
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") { ev.preventDefault(); sugI = (sugI + (ev.key === "ArrowDown" ? 1 : sugItems.length - 1)) % sugItems.length; renderSug(); }
  else if (ev.key === "Tab" || ev.key === "Enter") { ev.preventDefault(); pickSug(sugI); }
  else if (ev.key === "Escape") { ev.preventDefault(); sugItems = []; sug.hidden = true; }
});
sug.addEventListener("mousedown", (ev) => { const d = ev.target.closest("[data-i]"); if (d) { ev.preventDefault(); pickSug(+d.dataset.i); } });
// 開閉は PC だけ localStorage "rmx.chat.open" に覚える (スマホは毎回畳んで始める)。狭い幅はバー全体 (#chead) が押せる

  if (isMobileUA && !ev.target.closest("#ctoggle")) return void (document.documentElement.classList.contains("split") || document.body.classList.toggle("to-open")); // スマホ: 行 = 送り先の一覧の開閉、畳むのは右端の ▼ (2 列の時は一覧も送信欄も出したまま)
  if (!isNarrow() && !ev.target.closest("#ctoggle")) return;
  const closed = document.body.classList.toggle("chat-closed");
  document.body.classList.remove("to-open");
  if (!isMobileUA) try { localStorage.setItem("rmx.chat.open", closed ? "0" : "1"); } catch {}
};
// スマホ: 下の帯の送り先を押すと送信欄が開く。送信を押しても入力欄の焦点を外さない (外れるとキーボードが引っ込み、定型キーが戻って並びが動く)
document.getElementById("dto")?.addEventListener("click", () => { document.body.classList.remove("chat-closed"); document.body.classList.add("to-open"); }); // 送り先の一覧まで 1 回で開く (2026-11-13 user)
if (isMobileUA) csend.addEventListener("mousedown", (ev) => ev.preventDefault());

// セッション chip: 選択中プロジェクトの all (新しい順) で各セッションが最初に現れた entry = そのセッションの最新返事。並びも新しい順。
// 同じ repo のセッションが 2 つ以上なら HH:MM を添えて見分ける。
let chipsHtml = null;
const chipBtn = (key, on, label, title, raw = false, repo = null) => `<button class="chip${on ? " on" : ""}" data-s="${esc(key)}" aria-pressed="${on}" title="${esc(title)}"${repo === null ? "" : ` style="--rc:${repoColor(repo)}"`}>${raw ? label : esc(label)}</button>`;
function renderChips() {
  const seen = new Map();
  for (const e of inRepo(all)) if (e.session && !seen.has(e.session)) seen.set(e.session, e);
  const ss = [...seen.values()];
  const perRepo = new Map();
  for (const e of ss) perRepo.set(e.repo, (perRepo.get(e.repo) ?? 0) + 1);
  const chip = (key, label, title) => chipBtn(key, key === SESS, label, title);
  const base = (e) => e.codexPane ? `Codex · ${e.label}` : (e.repo || "?") + (perRepo.get(e.repo) > 1 && e.ts ? ` ${hhmm(new Date(e.ts))}` : "");
  const dup = new Map();
  for (const e of ss) dup.set(base(e), (dup.get(base(e)) ?? 0) + 1);
  const label = (e) => base(e) + (dup.get(base(e)) > 1 ? ` ·${e.session.slice(-4)}` : ""); // 同じ分に返事した同 repo 同士は鍵の末尾で見分ける
  chipLabels = new Map(ss.map((e) => [e.session, label(e)]));
  chipEntries = seen;
  renderChat();
  // 既定は live なセッションだけ (終了したものは #pdead で出す)。選択中は live でなくても出す (消えると迷子)
  const shown = ss.filter((e) => e.live || e.codex || e.bot || showDead || e.session === SESS); // Codex と Bot の返事は live にならないが終了扱いで隠さない
  const note = noteSession(SESS) && botNotes.find((e) => e.session === SESS);
  let html = ss.length || SESS ? chip("", "最新", "最後に返事したセッションを追う") + shown.map((e) => chipBtn(e.session, e.session === SESS, rcDot + esc(label(e)), `${e.repo} / ${e.session}`, true, e.repo)).join("") : "";
  if (SESS && !seen.has(SESS)) html += chip(SESS, note ? `${note.bot} item ${note.notice.number}` : "選択中 (返事なし)", SESS); // 履歴から消えたセッションを URL で指している
  if (html === chipsHtml) return; // 毎 poll 描き直すと横スクロール位置が飛ぶ
  chipsHtml = html;
  const box = document.getElementById("chips");
  box.innerHTML = html;
  // 選択中の chip が見えるよう帯だけを横に動かす。scrollIntoView は本文 (main) まで縦に動かし、新着で chip が描き直されるたびに読んでいた位置が上へ飛んだ (2026-10-18 user)
  const on = box.querySelector(".on")?.getBoundingClientRect(), bb = box.getBoundingClientRect();
  if (on) box.scrollLeft += Math.min(0, on.left - bb.left) || Math.max(0, on.right - bb.right);
}
document.getElementById("chips").addEventListener("click", async (ev) => {
  const b = ev.target.closest("[data-s]");

// chip / プロジェクトを選び直した後: 選択範囲の最新へ (name があればその返事へ)。以後その範囲の新着だけ追う
async function reselect(name) {

// プロジェクト列: all を repo ごとにまとめ、最後に返事した順に 1 行ずつ。先頭の「メイン」= 本体の返事を repo で絞らない。
// 未読 = そのプロジェクトを最後に選んで見た時より新しい返事がある。lastSeen (repo 小文字 → ts ms) を localStorage "rmx.seen" に持つ。
const tsOf = (e) => Date.parse(e?.ts ?? "") || 0;
let lastSeen = null;
try { lastSeen = JSON.parse(localStorage.getItem("rmx.seen")); } catch {}
const saveSeen = () => { try { localStorage.setItem("rmx.seen", JSON.stringify(lastSeen)); } catch {} };
const renderFilter = () => { document.getElementById("filter").innerHTML = REPO ? `[<span class="lbl">repo: </span>${esc(REPO)}]` : ""; };
let projHtml = null;
// 終了した repo (live な entry が 1 つも無い = 端末が全部閉じた) は既定で隠す。liveState = /history の x-rmv-live (ok 以外 = 判定不能なので全部出す)
let liveState = null, showDead = false;
try { showDead = localStorage.getItem("rmx.proj.dead") === "show"; } catch {}
function renderProjects() {
  // latest = 行に出す (モードの entry) / mainLatest = 未読の判定用 (本体の返事だけ、subagent の新着では赤くしない)
  const latest = new Map(), mainLatest = new Map(), alive = new Set();
  for (const e of all) {
    const k = e.repo.toLowerCase();
    if (!e.agent && !mainLatest.has(k)) mainLatest.set(k, e);
    if (!inMode(e)) continue;
    if (!latest.has(k)) latest.set(k, e);
    if (e.live || e.codex || e.bot) alive.add(k);
  }
  if (!lastSeen) { lastSeen = Object.fromEntries([...mainLatest].map(([k, e]) => [k, tsOf(e)])); saveSeen(); } // 初回は全部既読から始める

  if (!AGENTS && mainLatest.has(sel) && tsOf(mainLatest.get(sel)) > (lastSeen[sel] ?? 0)) { lastSeen[sel] = tsOf(mainLatest.get(sel)); saveSeen(); } // main で選んでいる間は既読
  const judged = liveState === "ok";
  let unread = false, hidden = 0, hiddenUnread = false;
  const rows = [...latest].map(([k, e]) => {
    const dot = tsOf(mainLatest.get(k)) > (lastSeen[k] ?? 0);
    const dead = judged && !alive.has(k) && k !== sel; // 選んでいる repo は隠さない (消えると迷子)
    if (dead) { hidden++; hiddenUnread ||= dot; }
    if (dead && !showDead) return "";
    unread ||= dot; // ☰ の赤は表示中の repo だけで数える
    return `<button class="prow${k === sel ? " on" : ""}${dead ? " dead" : ""}" data-r="${esc(e.repo)}" title="${esc(e.repo)}"><span class="pn" style="--rc:${repoColor(e.repo)}">${dot ? '<i class="dot" title="未読"></i>' : ""}<b>${rcDot}${esc(e.repo || "?")}</b><time>${e.ts ? hhmm(new Date(e.ts)) : ""}</time></span><span class="ph">${esc(cut(agentTag(e) + (e.head ?? ""), 30))}</span></button>`;
  });
  if (sel && !latest.has(sel)) rows.push(`<button class="prow on" data-r="${esc(REPO)}"><span class="pn"><b>${esc(REPO)}</b></span><span class="ph">返事なし</span></button>`); // URL が履歴に無い repo を指している
  const deadSess = judged && inRepo(all).some((e) => !e.live && !e.codex && !e.bot); // repo は活きていても、その中の終了したセッション (chip・送り先) を出すためのトグル
  const deadBtn = !hidden && !deadSess ? "" : showDead ? "終了したものを隠す" : `終了したものも表示${hidden ? ` (${hidden}${hiddenUnread ? "・未読あり" : ""})` : ""}`;
  const tabs = `<div class="ptabs"><button class="prow${sel || AGENTS ? "" : " on"}" data-r="" data-m=""><span class="pn"><b>メイン</b></span></button><button class="prow${AGENTS ? " on" : ""}" data-r="" data-m="agents" title="ワーカーと窓口役以外の Bot の返事を見る"><span class="pn"><b>🤖 ワーカー</b></span></button></div>`;
  const html = tabs + rows.join("") + (deadBtn ? `<button id="pdead" title="Claude が走っている端末が無い repo / セッション">${deadBtn}</button>` : "");
  document.getElementById("plist").title = judged ? "" : "端末の生死を判定できないので全部表示中";
  document.getElementById("ptoggle").classList.toggle("unread", unread); // 畳んでいても未読が分かるように

  projHtml = html;

}
document.getElementById("plist").addEventListener("click", async (ev) => {

// ＋ 新規: GET /worktrees の path を一覧にし、行を押したら即 POST /new (許可する cwd の判定は server だけ)。
// 並び = server の順 (herdr の workspace の番号順、Orca だけなら Orca の順) のまま。先頭 x-rmv-fixed 件より後ろ (どの workspace にも無い) だけ /history で最近返事があった順 (repo 基準)。
// worktree (/.worktrees/ /.harness-worktrees/) は親の下に字下げ。選んでいる repo の行は印だけ付け、先頭には移さない (開くたびに順が変わらないように)
const newpop = document.getElementById("newpop");
const closeNew = () => { newpop.hidden = true; document.body.classList.remove("new-open"); };
const WT_RE = /^(.*?)\/\.(?:harness-)?worktrees\//;
async function openNew() {
  const say = document.getElementById("cmsg");
  try {
    const r = await fetch("/worktrees", { cache: "no-store" });
    if (!r.ok) throw new Error((await r.text()) || String(r.status));
    const paths = await r.json();
    const fixed = Number(r.headers.get("x-rmv-fixed")) || 0;
    if (!Array.isArray(paths) || !paths.length) throw new Error("worktree が無い");
    const base = (p) => p.split("/").filter(Boolean).pop();
    const last = new Map(); // repo (小文字) → 最後の返事の時刻
    for (const e of all) { const k = e.repo.toLowerCase(), t = Date.parse(e.ts ?? "") || 0; if (t > (last.get(k) ?? -1)) last.set(k, t); }
    const rank = (p) => last.get(base(p).toLowerCase()) ?? -1;
    const byRank = (a, b) => rank(b) - rank(a);
    const want = (REPO || cur?.repo || "").toLowerCase();
    const curPath = want ? paths.find((p) => base(p).toLowerCase() === want && !WT_RE.test(p)) ?? paths.find((p) => base(p).toLowerCase() === want) : null;
    const parentOf = (p) => WT_RE.exec(p)?.[1];
    const mains = paths.filter((p) => !parentOf(p) || !paths.includes(parentOf(p)));
    const kids = (m) => paths.filter((p) => parentOf(p) === m).sort(byRank);
    const groupRank = (m) => Math.max(rank(m), ...kids(m).map(rank));
    const pos = (p) => { const i = paths.indexOf(p); return i < fixed ? i : Infinity; };
    const groupPos = (m) => Math.min(pos(m), ...kids(m).map(pos)); // 親の pane が無く worktree にだけ pane がある repo も、その workspace の位置に置く
    mains.sort((a, b) => groupPos(a) - groupPos(b) || groupRank(b) - groupRank(a)); // 固定順どうしは server の順、残り (Infinity - Infinity = NaN) は最近の順
    const cnt = new Map(); for (const m of mains) cnt.set(base(m), (cnt.get(base(m)) ?? 0) + 1);
    const label = (p) => cnt.get(base(p)) > 1 ? p.split("/").filter(Boolean).slice(-2).join("/") : base(p);
    const row = (p, sub) => `<button class="it${sub ? " sub" : ""}${p === curPath ? " cur" : ""}" data-cwd="${esc(p)}" title="${esc(p)}"><span>${sub ? "└ " : ""}${esc(sub ? base(p) : label(p))}</span>${p === curPath ? '<span class="k">選択中</span>' : ""}</button>`;
    newpop.innerHTML = `<div class="hd">どのフォルダで新しく始める?</div>` + mains.map((m) => row(m, false) + kids(m).map((c) => row(c, true)).join("")).join("");
    newpop.hidden = false;
    document.body.classList.add("new-open");
    say.textContent = "";
  } catch (e) { say.textContent = e.message ?? String(e); }
}
document.getElementById("newbtn").onclick = (ev) => { ev.stopPropagation(); if (isMobileUA) document.body.classList.add("proj-closed"); if (newpop.hidden) openNew(); else closeNew(); };
newpop.addEventListener("click", async (ev) => {
  ev.stopPropagation();
  const b = ev.target.closest("[data-cwd]");
  if (!b) return;
  const say = document.getElementById("cmsg");
  // 押したらすぐ一覧と列を閉じる。/new は Claude の起動完了まで返らない (数秒) ので、待ってから閉じると開いたままに見えた (2026-11-11 user)。成否は送信欄の下に出す
  const body = JSON.stringify({ cwd: b.dataset.cwd, near: chatTo()?.terminal ? chatTo().session : undefined }); // near = 送り先の pane (同じ session の socket で分割する)
  closeNew();
  document.body.classList.remove("proj-peek");
  say.textContent = `起動中: ${b.textContent.replace(/^└ |選択中$/g, "")}`;
  try {
    const r = await fetch("/new", { method: "POST", headers: { "content-type": "application/json" }, body });
    if (!r.ok) throw new Error((await r.text()) || String(r.status));
    say.textContent = "";
  } catch (e) { say.textContent = e.message ?? String(e); }
});
document.addEventListener("click", () => { if (!newpop.hidden) closeNew(); });
document.addEventListener("keydown", (ev) => { if (ev.code === "Escape" && !newpop.hidden) closeNew(); });

let fragMod = null;
// 入力中 = 右の欄か、カーソルのある入力欄に文字がある。この間は画面を差し替えない (送信後も右の欄にカーソルが残るので、空なら追従を止めない)
const typing = () => { const a = document.activeElement; return !!ctext.value.trim() || (!!a?.matches?.("textarea, input") && !!a.value.trim()); };
// 読んでいる途中 = 本文を下へスクロールしている。入力中と同じく差し替え・読み直しを止め、一番上に戻ったら追従を再開する (2026-10-18 user: 新着が来るたびに読んでいた返事が新着に替わり、一番上に戻されたように見えた)
const busy = () => typing() || mainEl.scrollTop > 0;
async function poll() {
  try {
    const hr = await fetch("/history", { cache: "no-store", headers: { "x-rmv-notices": "1" } });
    // index.html が更新されたら読み直す (サーバー再起動では開いたままの画面は変わらない、2026-09-29 実害)。赤ペンの下書き中は消さない
    const page = hr.headers.get("x-rmv-page");
    if (page) {
      const savedChat = [...chatDrafts].some(([key, text]) => key !== draftSession && text.trim());
      if (pageVer && page !== pageVer && !picks.size && !asktext.value.trim() && ![...ansDrafts.values()].some((t) => t.trim()) && !drafts.size && !savedChat && !busy()) return location.reload();
      pageVer = page;
    }
    liveState = hr.headers.get("x-rmv-live");
    const rows = await hr.json();
    botPerms = rows.filter((e) => e.name.startsWith("botperm-"));
    const notes = rows.filter((e) => e.name.startsWith("botitem-"));
    for (const e of botNotes) e.gone = e.session === SESS && !notes.some((n) => n.session === SESS);
    botNotes = [...notes, ...botNotes.filter((e) => e.session === SESS && !notes.some((n) => n.session === SESS))];
    all = rows.filter((e) => !e.name.startsWith("botperm-") && !e.name.startsWith("botitem-"));
    // 選んでいた repo が履歴から消えたら (repo の決め方が変わった・古い URL 等) すべてに戻す。空の画面で止めない
    if (REPO && !noteSession(SESS) && !codexPaneSession(SESS) && !codexPaneSession(chatPin()) && !all.some((e) => e.repo.toLowerCase() === REPO.toLowerCase())) { REPO = ""; SESS = ""; setParam("repo", ""); setParam("s", ""); renderFilter(); }
    renderChips();
    renderProjects();
    const next = scope();
    if (!next.length && (REPO || SESS || AGENTS)) { list = []; idx = 0; shownName = null; renderBar(); await show("", null); return; } // 絞り込み中・agents モードは他 repo / 他セッション / 本体の latest.html を映さない
    if (!next.length) { // 履歴導入前の state: latest.html だけ映す
      const r = await fetch("/fragment", { cache: "no-store" });
      const mod = r.headers.get("last-modified");
      if (mod !== fragMod) { fragMod = mod; await show(await r.text(), null); }
      list = []; renderBar(); return;
    }
    // 入力中・読んでいる途中でも、表示中と同じセッションの新着には切り替える (2026-10-22 user: 止めたかったのは他セッションの新着だけ)
    const sameSess = !!list[idx]?.session && next[0]?.session === list[idx].session;
    const keep = following && !hasDraft(shownName) && (!busy() || sameSess) ? null : list[idx]?.name; // 書きかけの赤ペン・入力中・読んでいる途中は新着で差し替えない (2026-10-16 user: 右の欄で返事を書いている最中に別の返事へ切り替わり、一番上に戻されたように見えた)
    list = next;
    if (keep) {
      const j = list.findIndex((e) => e.name === keep);
      // 追従のフラグは変えない: 読んでいる途中で新着を見送っただけなので、一番上に戻れば次の新着に追従する (showIdx(j) は j > 0 だと追従を切る)
      if (j >= 0) { const f = following, shown = showIdx(j); following = f; await shown; return; }
    }
    await showIdx(0);
  } catch (e) { console.error(e); }
}

poll();
setInterval(poll, 2000);
</script>
